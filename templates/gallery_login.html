<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#fff9f4">
    <title>Gallery Access - Houssem &amp; Eya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="particles">
        <div class="heart heart-1">♥</div>
        <div class="heart heart-2">♥</div>
        <div class="heart heart-3">♥</div>
        <div class="heart heart-4">♥</div>
        <div class="heart heart-5">♥</div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="gallery-lock-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="9" y1="21" x2="9" y2="9"/>
                    <rect x="3" y="11" width="18" height="10" rx="0" fill="currentColor" opacity="0.03" stroke="none"/>
                </svg>
            </div>
            <p class="login-subtitle">Wedding Memories</p>
            <h1 class="login-title">Private Gallery</h1>
            <div class="decorative-line">
                <span class="diamond">❖</span>
            </div>
            <p class="gallery-login-desc">Enter the access code to view photos shared by our lovely guests.</p>
            <form method="POST" class="login-form">
                <div class="form-group">
                    <label for="password">Gallery Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter access code..." required autofocus autocomplete="off">
                </div>
                {% if error %}
                    <p class="error-message">{{ error }}</p>
                {% endif %}
                <button type="submit" class="btn-primary btn-full">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    Unlock Gallery
                </button>
            </form>
            <a href="{{ url_for('index') }}" class="back-home-link">← Back to wedding site</a>
        </div>
    </div>
</body>
</html>
