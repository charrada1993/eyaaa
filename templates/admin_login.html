<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#fff9f4">
    <title>Admin Access - Houssem &amp; Eya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="particles">
        <div class="heart heart-1">♥</div>
        <div class="heart heart-2">♥</div>
        <div class="heart heart-3">♥</div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">Houssem &amp; Eya</h1>
            <p class="login-subtitle">Admin Access</p>
            <div class="decorative-line">
                <span class="diamond">❖</span>
            </div>
            <form method="POST" class="login-form">
                <div class="form-group">
                    <label for="password">Admin Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password..." required autofocus>
                </div>
                {% if error %}
                    <p class="error-message">{{ error }}</p>
                {% endif %}
                <button type="submit" class="btn-primary btn-full">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    Sign In
                </button>
            </form>
            <a href="{{ url_for('index') }}" class="back-home-link">← Back to wedding site</a>
        </div>
    </div>
</body>
</html>
